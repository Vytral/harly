name: Install Trivy
description: >-
  Install a pinned Trivy release straight from its GitHub release and verify it
  against the published checksums. trivy-action's bundled installer fetches the
  binary from get.trivy.dev, which stopped resolving and broke every release
  without a cached binary.
inputs:
  version:
    description: Trivy version without the leading v.
    required: false
    default: "0.70.0"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=64bit ;;
          aarch64 | arm64) arch=ARM64 ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
        tarball="trivy_${TRIVY_VERSION}_Linux-${arch}.tar.gz"
        work="$(mktemp -d)"
        curl -fsSL --retry 3 -o "$work/$tarball" "$base/$tarball"
        curl -fsSL --retry 3 -o "$work/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
        (cd "$work" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
        dest="$RUNNER_TEMP/trivy-bin"
        mkdir -p "$dest"
        tar -xzf "$work/$tarball" -C "$dest" trivy
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/trivy" --version
