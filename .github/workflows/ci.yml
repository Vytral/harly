name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Used by packages/db to build the client; tests that touch DB logic mock the
  # module, so this never needs a real Postgres instance in CI.
  DATABASE_URL: postgresql://harly:harly@localhost:5432/harly
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  HARLY_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-production
  NODE_ENV: test


jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Install + cache dependencies (shared across all jobs)
  # ─────────────────────────────────────────────────────────────────────────────
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Lint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm lint

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Type-check
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Type-check
        run: pnpm typecheck

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Test
        run: pnpm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: ignore

  migrations:
    name: PostgreSQL 16 migration chain
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: harly
          POSTGRES_PASSWORD: harly
          POSTGRES_DB: harly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harly -d harly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Check Drizzle chain
        run: pnpm exec drizzle-kit check --config packages/db/drizzle.config.ts
      - name: Clean migration and idempotent second run
        run: |
          pnpm --filter @harly/db db:migrate:local
          pnpm --filter @harly/db db:migrate:local
      - name: Concurrent first-owner bootstrap
        run: RUN_SETUP_INTEGRATION=1 pnpm --filter @harly/auth exec vitest run src/setup.integration.test.ts

  distribution:
    name: Image and CLI distribution
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build CLI and install its tarball in an empty directory
        run: |
          pnpm --filter @harly/cli test
          cd tooling/harly
          npm pack
          mkdir -p /tmp/harly-cli-smoke
          cd /tmp/harly-cli-smoke
          npm init -y
          npm install "$GITHUB_WORKSPACE"/tooling/harly/harly-cli-*.tgz
          npx harly --help
      - name: Validate Compose profiles
        run: |
          export HARLY_IMAGE="$(node -p 'const r=require("./release-manifest.json"); r.image + "@" + r.digest')"
          export HARLY_VERSION="$(node -p 'require("./release-manifest.json").version')" HARLY_URL=http://localhost:3000
          export POSTGRES_USER=harly POSTGRES_PASSWORD=harly POSTGRES_DB=harly
          export BETTER_AUTH_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa AI_ENCRYPTION_KEY=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          export STORAGE_UPLOAD_SECRET=cccccccccccccccccccccccccccccccc CRON_SECRET=dddddddddddddddddddddddddddddddd
          export HARLY_SETUP_SECRET=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee HARLY_INITIAL_ADMIN_EMAIL=owner@example.com
          docker compose config --quiet
          COMPOSE_PROFILES=proxy docker compose config --quiet
      - name: Build runtime image
        run: docker build -t harly:ci .
      - name: Reject runtime toolchain and TypeScript sources
        run: |
          docker run --rm --entrypoint sh harly:ci -c '! command -v pnpm && ! find /app -name "*.ts" -o -name "drizzle-kit" -o -name "tsx" | grep -q .'
      - name: Run self-hosted Compose smoke test
        env:
          COMPOSE_PROJECT_NAME: harly-ci
          HARLY_IMAGE: harly:ci
          HARLY_VERSION: ci
          HARLY_URL: http://127.0.0.1:3099
          HARLY_PORT: 3099
          POSTGRES_USER: harly
          POSTGRES_PASSWORD: harly-ci-postgres-password
          POSTGRES_DB: harly
          BETTER_AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AI_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          STORAGE_UPLOAD_SECRET: cccccccccccccccccccccccccccccccc
          CRON_SECRET: ddddddddddddddddddddddddddddddddd
          HARLY_SETUP_SECRET: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          HARLY_INITIAL_ADMIN_EMAIL: owner@example.com
          STORAGE_PROVIDER: local
        run: |
          docker compose up -d --wait --wait-timeout 240
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:3099/api/health/ready
          docker compose ps
      - name: Collect self-hosted smoke logs
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: harly-ci
        run: docker compose logs --no-color
      - name: Remove self-hosted smoke resources
        if: always()
        env:
          COMPOSE_PROJECT_NAME: harly-ci
        run: docker compose down --volumes --remove-orphans
