services:
  postgres:
    image: postgres:16-alpine
    container_name: openhire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openhire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openhire}
      POSTGRES_DB: ${POSTGRES_DB:-openhire}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - openhire_postgres:/var/lib/postgresql/data

volumes:
  openhire_postgres:
