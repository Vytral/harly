# Copy to .do/app.yaml, replace every REPLACE_ME value, then deploy with:
# doctl apps create --spec .do/app.yaml
#
# Attach a DigitalOcean Managed PostgreSQL database after creation and expose
# its connection string as DATABASE_URL to every component. S3 is mandatory:
# App Platform filesystem storage is ephemeral.
name: harly
region: nyc

envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_WITH_DIGITALOCEAN_MANAGED_POSTGRES_URL
  - key: HARLY_URL
    scope: RUN_TIME
    type: GENERAL
    value: https://REPLACE_ME.ondigitalocean.app
  - key: HARLY_INITIAL_ADMIN_EMAIL
    scope: RUN_TIME
    type: GENERAL
    value: owner@example.com
  - key: STORAGE_PROVIDER
    scope: RUN_TIME
    type: GENERAL
    value: s3
  - key: S3_BUCKET
    scope: RUN_TIME
    type: GENERAL
    value: REPLACE_ME
  - key: S3_REGION
    scope: RUN_TIME
    type: GENERAL
    value: auto
  - key: S3_ACCESS_KEY_ID
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_ME
  - key: S3_SECRET_ACCESS_KEY
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_ME
  - key: BETTER_AUTH_SECRET
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_ME
  - key: AI_ENCRYPTION_KEY
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_ME
  - key: STORAGE_UPLOAD_SECRET
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_ME
  - key: CRON_SECRET
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_ME
  - key: HARLY_SETUP_SECRET
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_ME

services:
  - name: web
    image: &harly_image
      registry_type: GHCR
      registry: vytral
      repository: harly
      tag: 0.1.0-beta.1
    run_command: node /app/runtime.mjs serve
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health/ready
      port: 3000
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 5

workers:
  - name: scheduler
    image: *harly_image
    run_command: node /app/runtime.mjs scheduler
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    image: *harly_image
    run_command: node /app/runtime.mjs migrate
    instance_size_slug: apps-s-1vcpu-0.5gb
