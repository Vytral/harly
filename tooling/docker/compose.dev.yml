name: curious-monkey

services:
  postgres:
    image: postgres:16-alpine
    container_name: harly-postgres
    restart: unless-stopped
    mem_limit: ${HARLY_DEV_POSTGRES_MEMORY:-512m}
    cpus: ${HARLY_DEV_POSTGRES_CPUS:-1.0}
    shm_size: 128m
    logging:
      driver: json-file
      options:
        max-size: ${HARLY_DEV_LOG_MAX_SIZE:-10m}
        max-file: ${HARLY_DEV_LOG_MAX_FILES:-2}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - harly_postgres:/var/lib/postgresql/data

volumes:
  harly_postgres:
