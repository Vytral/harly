# Generated from release-manifest.json. Replace `app` before the first deploy.
#
# Setup: fly launch --no-deploy, attach Managed Postgres, set the required
# secrets from .env, then run `fly deploy` from this repository root.
app = "replace-with-your-harly-app-name"
primary_region = "iad"

[build]
  image = "ghcr.io/vytral/harly@sha256:2941795e99fcb7b228fbd8c78a6f56d941d012909b4b06de9feba069364b3663"

[processes]
  web = "serve"
  scheduler = "scheduler"

[deploy]
  release_command = "migrate"

[http_service]
  processes = ["web"]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health/ready"
