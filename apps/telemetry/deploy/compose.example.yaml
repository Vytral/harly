# Example: collector + Caddy (TLS) for telemetry.harly.dev.
# Run from apps/telemetry:  docker compose -f deploy/compose.example.yaml up -d --build
# Create deploy/.env next to this file with TELEMETRY_STATS_TOKEN (see ../.env.example).
services:
  telemetry:
    build:
      context: ..
    restart: unless-stopped
    environment:
      TELEMETRY_STATS_TOKEN: ${TELEMETRY_STATS_TOKEN:-}
      # Caddy sits in front and sets X-Forwarded-For itself (never trust it otherwise).
      TELEMETRY_TRUST_PROXY: "1"
    volumes:
      - telemetry-data:/data
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - telemetry
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  telemetry-data:
  caddy-data:
  caddy-config:
